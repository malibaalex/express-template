services:
  # ============================================================================
  # API
  # ============================================================================
  api:
    image: ${IMAGE_NAME:-ghcr.io/owner/repo}:latest
    build:
      context: .
      target: runtime
    ports:
      - "${PORT:-4001}:${PORT:-4001}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-app_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ============================================================================
  # DATABASE MIGRATIONS
  # ============================================================================
  migrate:
    build:
      context: .
      target: build
    profiles:
      - tools
    command: pnpm exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-app_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ============================================================================
  # POSTGRES
  # ============================================================================
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-app_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
