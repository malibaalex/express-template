services:
  # ============================================================================
  # API
  # ============================================================================
  api:
    build:
      context: .
      target: runtime
    # Needed so `docker compose pull api` works in the deploy job.
    # Replace with your real GitHub owner/repo (lowercase).
    image: ghcr.io/owner/repo:latest
    ports:
      - "${PORT:-4001}:${PORT:-4001}"
    env_file:
      - .env
    environment:
      # Overrides any DATABASE_URL in .env, which usually points at localhost.
      # Inside Docker the database host is the service name "db".
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-app_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      # - proxy-tier   # uncomment when deploying behind a reverse proxy

  # ============================================================================
  # MIGRATIONS (one-off, run manually: docker compose run --rm migrate)
  # ============================================================================
  # The runtime image has no Prisma CLI (it is a devDependency), so migrations
  # run from the build stage instead.
  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    command: pnpm exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-app_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ============================================================================
  # POSTGRES
  # ============================================================================
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-app_db}
    ports:
      # Bound to localhost only so the database is not exposed publicly
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

  # Before enabling on the server: docker network create proxy-tier
  # proxy-tier:
  #   external: true

volumes:
  # Wipe the database completely with: docker compose down -v
  db_data:
