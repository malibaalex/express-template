name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. LINT & BUILD (all pushes and PRs to develop)
  # ============================================================================
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    env:
      NODE_ENV: test
      # Dummy value so Prisma config loads. Nothing connects to it here.
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/template_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check / build
        run: pnpm build

      # Uncomment when you add your first unit tests.
      # - name: Unit tests
      #   run: pnpm test:unit

  # ============================================================================
  # 2. INTEGRATION TESTS (single Node version, real PostgreSQL)
