name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CODE QUALITY & BUILD
  #    Verify that the code is clean, formatted, type-safe, and buildable.
  # ============================================================================
  lint-and-build:
    runs-on: ubuntu-24.04

    env:
      NODE_ENV: production
      # Dummy value so Prisma config can load.
      # No database connection is made during this job.
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/template_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

  # ============================================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  #    Runs only after code quality checks pass on a direct push to develop.
  # ============================================================================
  build-and-push:
    needs: lint-and-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

