name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CODE QUALITY & BUILD
  #    Verify that the code is clean, formatted, type-safe, and buildable.
  # ============================================================================
  lint-and-build:
    runs-on: ubuntu-24.04

    env:
      NODE_ENV: production

      # Build-only dummy value required by Prisma config.
      # No database connection is made during CI.
      # NEVER replace this with a real database credential.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

  # ============================================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  #    Runs only after code quality checks pass on a direct push to develop.
  #
  #    The resulting image is deployment-provider agnostic and can be deployed
  #    to a VPS or a serverless/container platform.
  # ============================================================================
  build-and-push:
    needs: lint-and-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
